<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💰 Кликер Голды</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .title {
            font-size: 3.5rem;
            font-weight: 800;
            color: #fff;
            margin-bottom: 20px;
            text-shadow: 0 4px 20px rgba(0,0,0,0.3);
            letter-spacing: 2px;
        }

        .gold-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            padding: 40px 60px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            margin-bottom: 40px;
            min-width: 300px;
            backdrop-filter: blur(10px);
            text-align: center;
        }

        .gold-label {
            font-size: 1.2rem;
            color: #666;
            margin-bottom: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .gold-count {
            font-size: 5rem;
            font-weight: 900;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            transition: transform 0.2s;
        }

        .gold-count.clicking {
            transform: scale(1.1);
        }

        .click-button {
            font-size: 1.8rem;
            font-weight: 700;
            padding: 25px 60px;
            margin: 10px;
            cursor: pointer;
            background: linear-gradient(135deg, #ffd700 0%, #ffed4e 100%);
            border: none;
            border-radius: 50px;
            box-shadow: 0 10px 30px rgba(255, 215, 0, 0.4);
            transition: all 0.2s ease;
            color: #333;
            text-shadow: 0 1px 2px rgba(255,255,255,0.5);
        }

        .click-button:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 40px rgba(255, 215, 0, 0.5);
        }

        .click-button:active {
            transform: scale(0.95);
            box-shadow: 0 5px 20px rgba(255, 215, 0, 0.6);
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-top: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .control-button {
            font-size: 1rem;
            font-weight: 600;
            padding: 15px 30px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 15px;
            color: #fff;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .control-button:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-3px);
        }

        .reset-button {
            font-size: 1rem;
            font-weight: 600;
            padding: 15px 30px;
            cursor: pointer;
            background: rgba(255, 59, 48, 0.3);
            border: 2px solid rgba(255, 59, 48, 0.5);
            border-radius: 15px;
            color: #fff;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .reset-button:hover {
            background: rgba(255, 59, 48, 0.5);
            transform: translateY(-3px);
        }

        .footer {
            margin-top: 50px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.9rem;
            font-weight: 500;
        }

        @media (max-width: 768px) {
            .title {
                font-size: 2.5rem;
            }
            
            .gold-count {
                font-size: 3.5rem;
            }
            
            .gold-card {
                padding: 30px 40px;
                min-width: 250px;
            }
            
            .click-button {
                font-size: 1.4rem;
                padding: 20px 40px;
            }
        }
    </style>
</head>
<body>
    <h1 class="title">💰 КЛИКЕР ГОЛДЫ</h1>

    <div class="gold-card">
        <div class="gold-label">Ваше золото</div>
        <div class="gold-count" id="goldCount">0</div>
    </div>

    <button class="click-button" id="clickBtn">✨ Кликнуть за голду</button>

    <div class="controls">
        <button class="control-button" id="saveBtn">💾 Сохранить</button>
        <button class="control-button" id="loadBtn">📥 Загрузить</button>
        <button class="reset-button" id="resetBtn">🔄 Сбросить</button>
    </div>

    <div class="footer">Прогресс сохраняется автоматически ✨</div>

    <script>
        let gold = 0;

        const goldDisplay = document.getElementById('goldCount');
        const clickBtn = document.getElementById('clickBtn');
        const saveBtn = document.getElementById('saveBtn');
        const loadBtn = document.getElementById('loadBtn');
        const resetBtn = document.getElementById('resetBtn');

        function updateDisplay() {
            goldDisplay.textContent = gold.toLocaleString();
        }

        clickBtn.addEventListener('click', () => {
            gold += 1;
            updateDisplay();
            
            goldDisplay.classList.add('clicking');
            setTimeout(() => {
                goldDisplay.classList.remove('clicking');
            }, 200);
        });

        saveBtn.addEventListener('click', () => {
            localStorage.setItem('gold', gold);
            alert('💾 Прогресс сохранен!');
        });

        loadBtn.addEventListener('click', () => {
            const savedGold = localStorage.getItem('gold');
            if (savedGold !== null) {
                gold = parseInt(savedGold, 10);
                updateDisplay();
                alert('✅ Прогресс загружен!');
            } else {
                alert('❌ Нет сохраненных данных.');
            }
        });

        resetBtn.addEventListener('click', () => {
            if (confirm('Вы уверены, что хотите сбросить прогресс?')) {
                gold = 0;
                updateDisplay();
                localStorage.setItem('gold', '0');
            }
        });

        window.addEventListener('beforeunload', () => {
            localStorage.setItem('gold', gold);
        });

        window.onload = () => {
            const savedGold = localStorage.getItem('gold');
            if (savedGold !== null) {
                gold = parseInt(savedGold, 10);
            }
            updateDisplay();
        };
    </script>
</body>
</html>
